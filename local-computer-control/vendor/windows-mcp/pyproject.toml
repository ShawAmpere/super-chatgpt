[project]
name = "windows-mcp"
version = "0.8.7"
description = "Lightweight MCP Server for interacting with Windows Operating System."
authors = [
    { name = "Jeomon George", email = "jeogeoalukka@gmail.com" }
]
readme = { text = "Windows MCP desktop backend with local input, observation and timeout patches. Source: https://github.com/CursorTouch/Windows-MCP", content-type = "text/plain" }
license = "MIT"
license-files = ["LICENSE"]
keywords = ["windows", "mcp", "ai", "desktop", "ai agent"]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.14",
    "Topic :: Desktop Environment",
    "Topic :: System :: Shells",
]
dependencies = [
    "click>=8.2.1",
    "comtypes>=1.4.15",
    "dxcam>=0.3.0",
    "fastmcp>=3.0",
    "fuzzywuzzy>=0.18.0",
    "markdownify>=1.1.0",
    "pillow>=11.2.1",
    "platformdirs>=4.3.8",
    "posthog>=7.4.0",
    "psutil>=7.0.0",
    "pygments>=2.20.0",
    "python-levenshtein>=0.27.1",
    "pywin32>=311",
    "requests>=2.33.0",
    "tabulate>=0.9.0",
    "thefuzz>=0.22.1",
    "uuid7>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/CursorTouch"
Repository = "https://github.com/CursorTouch/Windows-MCP"
Issues = "https://github.com/CursorTouch/Windows-MCP/issues"

[project.scripts]
windows-mcp = "windows_mcp.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
constraint-dependencies = ["pydantic-settings>=2.14.2"]

[tool.uv.extra-build-dependencies]
pyperclip = ["setuptools"]
